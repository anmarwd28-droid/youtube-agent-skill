<script>

    return `<span style="color:${key ? mix('#77736d', '#f4c76b', q) : mix('#77736d', '#ffffff', q)}">${w}</span>`; }).join(' ');

const STARS = (() => { const r = R(17); return Array.from({ length: 140 }, () => [r() * 720, r() * 1280, r() * 1.5 + .35, r() * 6]); })();
const stars = (a, t) => STARS.map(s => `<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="#fff" opacity="${a * (.45 + .45 * Math.sin(t * 1.4 + s[3]))}"/>`).join('');

    `<rect width="720" height="1280" fill="url(#spg)"/>` + stars(1, t) +
    `<circle cx="600" cy="300" r="320" fill="#4b2fa8" opacity=".12" filter="url(#soft)"/>`;
}
function sun(x, y, r, a, t) {
  if (a <= 0.001) return '';

    Array.from({ length: 7 }, (_, i) => `<circle cx="${x + Math.cos(i * 1.7 + t * .3) * r * .5}" cy="${y + Math.sin(i * 2.3 + t * .25) * r * .5}" r="${r * .12}" fill="#ffb347" opacity=".35"/>`).join('') + `</g>`;
}
function earth(x, y, r, day, t, lights = 0) {
  // day: 0..1 how lit the sun-facing (left) side is
  const rot = t * 6;
  const land = `<g transform="translate(${x},${y}) scale(${r})"><g clip-path="url(#earthClip)">` +
    `<circle r="1" fill="url(#earthNight)"/><circle r="1" fill="url(#earthDay)" opacity="${day}"/>` +
    `<g fill="${mix('#0f2318', '#3fae7a', day)}" opacity=".9" transform="translate(${((rot % 4) - 2) * .25},0)">` +
    `<ellipse cx="-.25" cy="-.2" rx=".34" ry=".22" transform="rotate(-25)"/><ellipse cx=".35" cy=".25" rx=".22" ry=".32" transform="rotate(15)"/><ellipse cx="-.1" cy=".58" rx=".25" ry=".1"/><ellipse cx=".9" cy="-.3" rx=".3" ry=".2"/><ellipse cx="-1.1" cy=".1" rx=".3" ry=".25"/></g>` +
    `<g fill="#fff" opacity="${.45 * day + .08}"><ellipse cx="-.1" cy="-.55" rx=".5" ry=".06"/><ellipse cx=".2" cy=".05" rx=".45" ry=".05"/></g>` +
    (lights > 0 ? Array.from({ length: 26 }, (_, i) => { const rr = R(i + 3); const a = rr() * 6.28, d = Math.sqrt(rr()) * .85;
      return `<circle cx="${Math.cos(a) * d}" cy="${Math.sin(a) * d}" r="${.012 + rr() * .015}" fill="#ffcf87" opacity="${lights * (.5 + .5 * Math.sin(t * 3 + i))}"/>`; }).join('') : '') +
    // terminator: right side always night
    `<rect x="${lerp(-1, .05, day)}" y="-1" width="2" height="2" fill="#020510" opacity="${.55 * day}"/>` +
    `</g></g>`;
  return `<circle cx="${x}" cy="${y}" r="${r * 1.14}" fill="url(#atm)" opacity="${.35 + .65 * day}"/>` + land;
}
function moon(x, y, r, a) { return `<g opacity="${a}"><circle cx="${x}" cy="${y}" r="${r}" fill="url(#moonG)"/><circle cx="${x - r * .3}" cy="${y + r * .1}" r="${r * .18}" fill="#000" opacity=".12"/></g>`; }

function palm(x, y, h, c, t = 0) {

  let s = `<path d="M${x},${y} Q${x + h * .02},${y - h * .55} ${tx},${ty}" stroke="${c}" stroke-width="${Math.max(4, h * .05)}" fill="none" stroke-linecap="round"/>`;
  [-160, -130, -100, -70, -40, -15, 15].forEach((a, i) => { const ang = (a + Math.sin(t * 1.1 + i) * 1.2) * Math.PI / 180, Ln = h * .42;
    const ex = tx + Math.cos(ang) * Ln, ey = ty + Math.sin(ang) * Ln * .55 + Ln * .35, cx = tx + Math.cos(ang) * Ln * .5, cy = ty + Math.sin(ang) * Ln * .5 - Ln * .08;
    s += `<path d="M${tx},${ty} Q${cx},${cy} ${ex},${ey}" stroke="${c}" stroke-width="${Math.max(3, h * .035)}" fill="none" stroke-linecap="round"/>`; });
  return s;
}
function skyline(seed, base, color, frost, winA) {
  const r = R(seed); let s = '', x = -40;
  while (x < 760) { const w = 40 + r() * 80, h = 60 + r() * 220, k = r();
    s += `<rect x="${x}" y="${base - h}" width="${w}" height="${h + 300}" fill="${color}"/><rect x="${x}" y="${base - h - 3}" width="${w}" height="${6 * frost}" fill="#eaf6ff" opacity="${frost}"/>`;

}

// o: {s, face, phase, moving, top, pants, skin, hair, lookUp, phone(0..1 light), coat, hat, scarf, hug, breath, t}
function person(x, y, o) {
