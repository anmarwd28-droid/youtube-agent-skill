<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  canvas.gl { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  svg.ov { position: absolute; inset: 0; pointer-events: none; }
  #cap { position: absolute; left: 90px; right: 90px; bottom: 46px; text-align: center; }
  #cap .line { display: inline-block; font-family: 'Noto Naskh Arabic', serif; direction: rtl; font-size: 40px; font-weight: 700; line-height: 1.45; color: #fff;
               padding: 4px 22px 10px; border-radius: 14px; background: rgba(5,8,18,.45); text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  .chip { position: absolute; padding: 5px 16px 8px; border-radius: 12px; background: rgba(244,199,107,.95); color: #1c140a; white-space: nowrap;
          font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 24px; direction: rtl; transform: translate(-50%, -50%); opacity: 0; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .chip.dark { background: rgba(8,12,30,.72); color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .chip.big { font-size: 46px; padding: 10px 30px 16px; }
  #chapter { position: absolute; right: 36px; top: 30px; padding: 6px 18px 9px; border-radius: 12px; background: rgba(8,12,30,.6); border: 1px solid rgba(244,199,107,.5);
             color: #f4c76b; font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 24px; direction: rtl; opacity: 0; }
  #title { position: absolute; left: 0; right: 0; top: 230px; text-align: center; opacity: 0; }
  #title .t { font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 74px; color: #fff; direction: rtl; text-shadow: 0 4px 30px rgba(0,0,0,.8); }
  #title .t b { color: #f4c76b; }
  #title .s { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 3px; color: #cfd6ff; margin-top: 6px; }
  #cta { position: absolute; right: 120px; top: 150px; width: 520px; text-align: center; opacity: 0; }
  #cta .q { font-family: 'Amiri', serif; font-weight: 700; font-size: 230px; line-height: 1; color: #f4c76b; text-shadow: 0 0 40px rgba(244,199,107,.45); }
  #cta .sub { display: inline-block; margin-top: 18px; padding: 10px 28px 14px; border-radius: 40px; background: #e62117; color: #fff; font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 30px; direction: rtl; }
  #cta .h { margin-top: 14px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 26px; color: #fff; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="stage">
  <canvas class="gl" id="glA"></canvas>
  <canvas class="gl" id="glB"></canvas>
  <svg class="ov" id="ppl" width="1280" height="720" viewBox="0 0 1280 720">
    <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
    <g id="pplG"></g>
  </svg>
  <svg class="ov" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
    </defs>
    <rect width="1280" height="720" fill="url(#vig)"/>
    <rect width="1280" height="720" filter="url(#grain)" opacity=".04" style="mix-blend-mode:overlay"/>
    <rect id="fade" width="1280" height="720" fill="#000" opacity="0"/>
  </svg>
  <div id="chips"></div>
  <div id="chapter"></div>
  <div id="title"><div class="t">ماذا لو <b>بقيت الثلوج تتساقط</b> لمدّة سنة؟</div><div class="s">MADHA LAW LAB</div></div>
  <div id="cta"><div class="q">؟</div><div class="sub">اشترك ▶</div><div class="h">@MadhaLawLab</div></div>
  <div id="cap"><div class="line"></div></div>
</div>
<script type="module">
import { build, makeRenderers } from './world_snow.js';
const TM = window.TIMING, TOTAL = window.TOTAL;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; }, ramp = (t, a, b) => clamp((t - a) / (b - a));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); };
const L = i => TM[i], W = (i, j) => TM[i].words[j];
const T = { day1: L(5).start, week: L(9).start, wires: L(11).start, fire: L(12).start, roof: L(13).start, month: L(16).start, globe: L(21).start, albedo: L(22).start,
  sea: L(25).start, layers: L(27).start, year: L(30).start, ball: L(33).start, volc: L(36).start, cant: L(37).start, baker: L(39).start, end: L(42).start };

// ---- captions: chunks of up to 8 words, split at punctuation
const CH = []; TM.forEach(l => { let cur = []; l.words.forEach((w, i) => { cur.push(w); const p = /[،.…؟:!»]$/.test(w[0]); if ((p && cur.length >= 3) || cur.length >= 8 || i === l.words.length - 1) { CH.push(cur); cur = []; } }); });
const GOLD = /^(بيضاء\.|سنة؟|ألفينِ|وثمانية،|الأوّل،|الصفر،|أسبوع،|المترَ|السطوح\.|مئاتِ|شهر،|تسعينَ|أكثر…|ستّةِ|جليدٍ|عشراتِ|المآذنِ|جليدياً\.|سبعمئةِ|البراكينَ|لا\.|تسعةٍ|وعشرينَ|طوابق\.|ماذا|لو…؟|لو…)$/;
function renderCap(t) {
  let c = null; for (const ch of CH) if (t >= ch[0][1] - .08) c = ch;
  const el = $('cap'); if (!c) { el.style.opacity = 0; return; }
  const next = CH[CH.indexOf(c) + 1], end = next ? next[0][1] - .12 : TOTAL - .3, gone = !next ? 0 : ramp(t, c[c.length - 1][2] + .9, c[c.length - 1][2] + 1.1);
  el.style.opacity = ease(ramp(t, c[0][1] - .08, c[0][1] + .12)) * (1 - gone) * (t < end + .12 ? 1 : 0);
  el.querySelector('.line').innerHTML = c.map(([w, s]) => { const k = ramp(t, s - .05, s + .1); return `<span style="color:${GOLD.test(w) ? mix('#9a958c', '#f4c76b', k) : mix('#9a958c', '#ffffff', k)}">${w}</span>`; }).join(' ');
}
// ---- chips
const CHIPS = [
  { id: 'y08', txt: '٢٠٠٨: الثلج في بغداد', a: W(3, 8)[1], b: L(4).end, x: 640, y: 110 },
  { id: 'kg', txt: 'مئات الكيلوغرامات على كل متر مربع', a: W(14, 5)[1], b: L(15).end, x: 640, y: 110 },
  { id: 'alb', txt: 'الثلج الطازج يعكس نحو ٩٠٪ من ضوء الشمس', a: W(22, 7)[1], b: L(23).end, x: 640, y: 100 },
  { id: 'loop', txt: 'برد ← ثلج أكثر ← برد أكثر', a: L(24).start, b: L(24).end + .4, x: 640, y: 100, big: 1 },
  { id: 'sea', txt: 'مستوى البحار ينخفض', a: W(26, 5)[1], b: L(26).end + .4, x: 640, y: 100, dark: 1 },
  { id: 'l1', txt: 'ثلج جديد', a: T.layers + 1, b: L(29).end, x: 300, y: 250, dark: 1 },
  { id: 'l2', txt: 'ثلج مضغوط', a: W(28, 2)[1], b: L(29).end, x: 300, y: 380, dark: 1 },
  { id: 'l3', txt: 'جليد صلب', a: W(28, 5)[1], b: L(29).end, x: 300, y: 500 },
  { id: 'ice', txt: 'بداية عصر جليدي', a: W(32, 7)[1], b: L(32).end + .4, x: 640, y: 110, big: 1 },
  { id: 'ma', txt: 'قبل نحو ٧٠٠ مليون سنة', a: L(34).start + .3, b: L(34).end + .4, x: 640, y: 110 },
  { id: 'vol', txt: 'البراكين دفّأت الأرض من جديد', a: W(36, 3)[1], b: L(36).end + .3, x: 640, y: 110, dark: 1 },
  { id: 'no', txt: 'لا', a: L(38).start, b: L(38).start + 2, x: 640, y: 300, big: 1 },
  { id: 'mb', txt: '٢٩ متراً في موسم واحد', a: W(40, 9)[1], b: L(40).end + .5, x: 860, y: 140 },
  { id: 'fl', txt: '= بناية من ١٠ طوابق', a: L(41).start + .2, b: L(41).end + .4, x: 420, y: 140, dark: 1 },
];
$('chips').innerHTML = CHIPS.map(c => `<div class="chip${c.dark ? ' dark' : ''}${c.big ? ' big' : ''}" id="c_${c.id}">${c.txt}</div>`).join('');
const CHAPTERS = [[T.day1, 'اليوم الأول'], [T.week, 'بعد أسبوع'], [T.month, 'بعد شهر'], [T.globe, 'الحلقة الخطيرة'], [T.layers, 'بعد ستة أشهر'], [T.year, 'بعد سنة'], [T.ball, 'الأرض كرة من الثلج'], [T.cant, 'هل يمكن أن يحدث؟']];
function renderUI(t) {
  CHIPS.forEach(c => { const el = $('c_' + c.id); let o = ease(ramp(t, c.a, c.a + .35)) * (1 - ease(ramp(t, c.b - .3, c.b))); if (c.gate) o *= c.gate();
    if (o > 0 && c.at) { const p = c.at(); el.style.left = (p.x + (c.dx || 0)) + 'px'; el.style.top = (p.y + (c.dy || 0)) + 'px'; } else if (c.x) { el.style.left = c.x + 'px'; el.style.top = c.y + 'px'; }
    el.style.opacity = o; });
  let ch = null; CHAPTERS.forEach(c => { if (t >= c[0]) ch = c; });
  const ce = $('chapter'); if (ch) { ce.textContent = ch[1]; ce.style.opacity = ease(ramp(t, ch[0], ch[0] + .4)) * (1 - ease(ramp(t, ch[0] + 4, ch[0] + 4.6))); } else ce.style.opacity = 0;
  const tk = ease(ramp(t, L(2).start - .1, L(2).start + .4)) * (1 - ease(ramp(t, L(3).start + .2, L(3).start + .8))); $('title').style.opacity = tk; $('title').style.transform = `scale(${.94 + .06 * tk})`;
  const ck = ease(ramp(t, T.end, T.end + .6)); $('cta').style.opacity = ck; $('cta').style.transform = `translateY(${(1 - ck) * 20}px)`;
  $('turb').setAttribute('seed', String(Math.floor(t * 24) % 50));
  $('fade').setAttribute('opacity', clamp((t - (TOTAL - .6)) / .6) + (1 - clamp(t / .4)));
}
// ---------- people (two-segment limbs, shading, winter clothes) ----------
const rot = (a, Ln) => [Math.sin(a) * Ln, Math.cos(a) * Ln];
function limb(x0, y0, a1, a2, L1, L2, w, c) {
  const [dx1, dy1] = rot(a1, L1), x1 = x0 + dx1, y1 = y0 + dy1, [dx2, dy2] = rot(a2, L2), x2 = x1 + dx2, y2 = y1 + dy2;
  return { svg: `<path d="M${x0},${y0} L${x1},${y1} L${x2},${y2}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`, x2, y2 };
}
// o: {s, face, phase, moving, top, pants, skin, hair, lookUp, phone(0..1 light), coat, hat, scarf, hug, breath, t}
function person(x, y, o) {
  const s = o.s || 1, f = o.face || 1, p = o.phase || 0, mv = o.moving ? 1 : 0, t = o.t || 0;
  const hipY = -150 - (mv ? Math.abs(Math.cos(p)) * 4 : 0), bulk = o.coat ? 7 : 0;
  const A = o.amp || .42; const leg = ph => { const a = Math.sin(ph) * A * mv, bend = (Math.max(0, Math.cos(ph)) * .75 + .05) * mv; return limb(0, hipY, a, a - bend, 76, 74, 19, o.pants); };
  const shoe = (l, c) => `<ellipse cx="${l.x2 + 9}" cy="${l.y2 + 1}" rx="17" ry="7" fill="${c}"/>`;
  const L1 = leg(p + Math.PI), L2 = leg(p);
  const ty = hipY - 112, coatLen = o.coat ? 34 : 0;
  const torso = `<path d="M${-23 - bulk},${hipY + 6 + coatLen} C${-27 - bulk},${hipY - 40} ${-31 - bulk},${ty + 18} ${-22 - bulk},${ty + 4} Q4,${ty - 9} ${26 + bulk},${ty + 6} C${33 + bulk},${ty + 30} ${27 + bulk},${hipY - 40} ${25 + bulk},${hipY + 6 + coatLen} Z" fill="${o.top}"/>` +
    `<path d="M${-23 - bulk},${hipY + 6 + coatLen} C${-27 - bulk},${hipY - 40} ${-31 - bulk},${ty + 18} ${-22 - bulk},${ty + 4} L-6,${ty} L-8,${hipY + 6 + coatLen}Z" fill="#000" opacity=".22"/>` +
    (o.coat ? [0, 1, 2, 3].map(i => `<path d="M${-22 - bulk},${ty + 30 + i * 30} Q2,${ty + 38 + i * 30} ${26 + bulk},${ty + 30 + i * 30}" stroke="#000" stroke-opacity=".18" stroke-width="2" fill="none"/>`).join('') : '');
  const shX = 2, shY = ty + 14, swing = -Math.sin(p) * A * .85 * mv;
  let armB, armF;
  if (o.hug) { armB = limb(shX - 6, shY, .35, -1.6, 54, 44, 15, o.top); armF = limb(shX + 4, shY, .3, -1.75, 54, 46, 16, o.top); }
  else if (o.phone) { armB = limb(shX - 4, shY, -swing - .05, -swing + .25, 60, 56, 14, o.top); armF = limb(shX, shY, 1.9, 2.6, 58, 50, 15, o.top); }
  else { armB = limb(shX - 4, shY, -swing - .05, -swing + .25, 60, 56, 14, o.top); armF = limb(shX, shY, swing + .05, swing + .3, 60, 56, 15, o.top); }
  const hx = 6, hy = ty - 34, tilt = -16 * (o.lookUp || 0);
  const head = `<rect x="${hx - 7}" y="${ty - 16}" width="14" height="20" rx="5" fill="${o.skin}"/>` +
    `<g transform="rotate(${tilt},${hx},${hy + 14})">` +
    `<ellipse cx="${hx}" cy="${hy}" rx="20" ry="24" fill="${o.skin}"/><ellipse cx="${hx - 6}" cy="${hy + 2}" rx="13" ry="20" fill="#000" opacity=".12"/>` +
    (o.hat ? `<path d="M${hx - 22},${hy - 4} C${hx - 22},${hy - 34} ${hx + 22},${hy - 34} ${hx + 22},${hy - 6} Z" fill="${o.hat}"/><rect x="${hx - 23}" y="${hy - 9}" width="46" height="8" rx="4" fill="${o.hat}" opacity=".85"/><circle cx="${hx}" cy="${hy - 32}" r="6" fill="${o.hat}"/>`
           : `<path d="M${hx - 21},${hy - 2} C${hx - 24},${hy - 30} ${hx + 6},${hy - 36} ${hx + 21},${hy - 14} C${hx + 14},${hy - 20} ${hx - 2},${hy - 18} ${hx - 8},${hy - 12} C${hx - 12},${hy - 4} ${hx - 14},${hy + 6} ${hx - 21},${hy - 2}Z" fill="${o.hair}"/>`) +
    `<ellipse cx="${hx + 11}" cy="${hy - 2}" rx="2.4" ry="3" fill="#1a120d"/><path d="M${hx + 6},${hy - 9} q6,-3 11,0" stroke="${o.hair}" stroke-width="2.4" fill="none" stroke-linecap="round"/>` +
    `<ellipse cx="${hx - 14}" cy="${hy + 1}" rx="4" ry="6.5" fill="${o.skin}"/>` + `</g>`;
  const scarf = o.scarf ? `<path d="M${hx - 16},${ty - 10} Q${hx},${ty + 2} ${hx + 18},${ty - 10} L${hx + 18},${ty + 2} Q${hx},${ty + 14} ${hx - 16},${ty + 2}Z" fill="${o.scarf}"/><rect x="${hx - 12}" y="${ty}" width="11" height="40" rx="4" fill="${o.scarf}"/>` : '';
  let extra = '';
  if (o.phone) { const lx = armF.x2, ly = armF.y2;
    extra = `<rect x="${lx - 5}" y="${ly - 14}" width="10" height="18" rx="2" fill="#111"/>` +
      `<polygon points="${lx},${ly - 10} ${lx + 70},${ly - 300} ${lx - 20},${ly - 310}" fill="#fff6dc" opacity="${.07 * o.phone}" filter="url(#soft)"/><circle cx="${lx}" cy="${ly - 10}" r="${16 * o.phone}" fill="#fff" opacity="${.35 * o.phone}" filter="url(#blur2)"/><circle cx="${lx}" cy="${ly - 10}" r="4" fill="#fff" opacity="${o.phone}"/>`; }
  let breath = '';
  if (o.breath) for (let i = 0; i < 4; i++) { const k = ((t * .55 + i / 4 + (o.seed || 0)) % 1);
    breath += `<circle cx="${hx + 26 + k * 46}" cy="${hy + 8 - k * 22}" r="${5 + k * 16}" fill="#eef6ff" opacity="${(1 - k) * .45 * o.breath}" filter="url(#blur2)"/>`; }
  const shadow = `<ellipse cx="4" cy="2" rx="44" ry="8" fill="#000" opacity=".3" filter="url(#blur2)"/>`;
  return `<g transform="translate(${x},${y}) scale(${f * s},${s})">${shadow}` +
    armB.svg + `<circle cx="${armB.x2}" cy="${armB.y2}" r="7" fill="${o.skin}"/>` + L1.svg.replace(o.pants, '#1d2028') + shoe(L1, '#3a3530') +
    torso + scarf + head + L2.svg + shoe(L2, '#4a443c') + armF.svg + `<circle cx="${armF.x2}" cy="${armF.y2}" r="7.5" fill="${o.skin}"/>` + extra + breath + `</g>`;
}

function drawPeople(o, w, t) {
  if (!o.people2d || w <= 0) return '';
  return `<g opacity="${w}">` + o.people2d.slice().sort((a, b) => a.depth - b.depth).map(p => {
    const c = p.c, q = p.q, s = p.h / 320;
    const winter = p.hug || p.coat ? { coat: true, hat: c.hat || '#2b3a55', scarf: c.scarf || '#c9a14a', breath: 1, seed: c.x * .3 } : {};
    return `<g style="filter:brightness(${p.light})">${person(p.x, p.y, { s, face: c.d, moving: q.moving, phase: q.phase, amp: q.amp, top: c.top, pants: '#2a2c34', skin: c.skin, hair: c.hair, hug: p.hug, t, ...winter })}</g>`; }).join('') + `</g>`;
}
const SC = await build(T);
const [rA, rB] = makeRenderers($('glA'), $('glB'), 1.5);
const SCENES = [{ s: 0, o: SC.C }, { s: T.roof - .2, o: SC.HO }, { s: T.month - .2, o: SC.C }, { s: T.globe - .2, o: SC.GL }, { s: T.layers - .2, o: SC.LY },
  { s: T.year - .2, o: SC.C }, { s: T.ball - .2, o: SC.GL }, { s: T.cant - .2, o: SC.C }, { s: T.baker - .2, o: SC.MB }, { s: T.end - .2, o: SC.EN }];
const XF = .6;
window.render = function (t) {
  let i = 0; SCENES.forEach((sc, j) => { if (t >= sc.s) i = j; });
  const cur = SCENES[i], prev = SCENES[i - 1], k = prev ? ease(ramp(t, cur.s, cur.s + XF)) : 1;
  if (prev && k < 1 && prev.o !== cur.o) { prev.o.update(t); rA.render(prev.o.sc, prev.o.cam); $('glA').style.opacity = 1; } else $('glA').style.opacity = 0;
  cur.o.update(t); rB.render(cur.o.sc, cur.o.cam); $('glB').style.opacity = prev && prev.o !== cur.o ? k : 1;
  $('pplG').innerHTML = (prev && k < 1 ? drawPeople(prev.o, 1 - k, t) : '') + drawPeople(cur.o, prev ? k : 1, t);
  renderUI(t); renderCap(t);
};
window.sceneReady = true;
</script>
</body>
</html>
