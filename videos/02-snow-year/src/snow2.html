<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #04060f; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  svg.l { position: absolute; inset: 0; }
  #cap { position: absolute; left: 120px; right: 120px; bottom: 34px; text-align: center; }
  #cap .line { display: inline-block; font-family: 'Noto Naskh Arabic', serif; direction: rtl; font-size: 36px; font-weight: 700; line-height: 1.5;
               color: #fff; padding: 4px 22px 8px; border-radius: 16px; background: rgba(6,10,24,.42); text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  #title { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: 'Noto Naskh Arabic', serif; font-weight: 700; direction: rtl;
           font-size: 70px; color: #fff; line-height: 1.35; text-shadow: 0 4px 30px rgba(0,0,0,.8); opacity: 0; }
  #title span { color: #bfe6ff; }
  .list { position: absolute; top: 26px; right: 26px; height: 46px; padding: 0 18px; border-radius: 23px; background: rgba(8,12,30,.5);
          border: 1px solid rgba(255,255,255,.16); display: flex; align-items: center; gap: 6px; direction: rtl; }
  .list .it { font-family: 'Noto Naskh Arabic', serif; font-size: 20px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .list .dot { width: 10px; height: 10px; border-radius: 50%; }
  .list .bar { width: 26px; height: 2px; background: rgba(255,255,255,.25); }
  .chip { position: absolute; padding: 5px 16px 8px; border-radius: 14px; background: rgba(244,199,107,.96); color: #1c140a; white-space: nowrap;
          font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 26px; direction: rtl; transform: translate(-50%, -50%); opacity: 0;
          box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .chip.dark { background: rgba(8,12,30,.72); color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .chip.ice { background: rgba(225,242,255,.95); color: #0d2238; }
  .chip.big { font-size: 40px; padding: 6px 26px 12px; }
  .chip.red { background: rgba(214,64,64,.95); color: #fff; }
  #board { position: absolute; left: 60px; top: 70px; width: 380px; border-radius: 12px; background: rgba(10,14,22,.92); border: 2px solid #2b3446;
           font-family: 'Noto Naskh Arabic', serif; font-weight: 700; direction: rtl; color: #ffd76a; opacity: 0; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #board .h { padding: 8px 18px; font-size: 22px; color: #fff; background: #1b2438; border-radius: 10px 10px 0 0; }
  #board .r { display: flex; justify-content: space-between; padding: 6px 18px; font-size: 22px; border-top: 1px solid #222b3c; }
  #board .r b { color: #ff6b6b; }
</style>
</head>
<body>
<div id="stage">
  <svg id="v" class="l" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="blur2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="blur1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
      <filter id="haze" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
      <filter id="snowTex" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".035 .09" numOctaves="3" seed="4"/>
        <feColorMatrix values="0 0 0 0 .80  0 0 0 0 .87  0 0 0 0 .96  0 0 0 -1.1 .75"/><feComposite in2="SourceGraphic" operator="in"/></filter>
      <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      <radialGradient id="flk"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#eef4fb"/><stop offset="1" stop-color="#c3d4e6"/></linearGradient>
      <linearGradient id="snowCap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#eaf2fa"/><stop offset="1" stop-color="#b8cbe0"/></linearGradient>
      <radialGradient id="sunGlow"><stop offset="0" stop-color="#fff2c8" stop-opacity=".9"/><stop offset=".3" stop-color="#ffd27a" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
      <radialGradient id="sunCore" cx=".42" cy=".4" r=".7"><stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb347"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" stop-color="#ffd59a" stop-opacity=".9"/><stop offset=".35" stop-color="#ffb35c" stop-opacity=".3"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
      <radialGradient id="lavaG"><stop offset="0" stop-color="#ffd08a" stop-opacity=".95"/><stop offset=".3" stop-color="#ff6a2a" stop-opacity=".5"/><stop offset="1" stop-color="#ff3a1a" stop-opacity="0"/></radialGradient>
      <linearGradient id="iceG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3f7"/><stop offset=".5" stop-color="#6fb2dc"/><stop offset="1" stop-color="#2f6f9e"/></linearGradient>
      <linearGradient id="therm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff5a3c"/><stop offset=".5" stop-color="#7fc8ff"/><stop offset="1" stop-color="#d9f2ff"/></linearGradient>
      <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
      <marker id="arrY" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4c76b"/></marker>
      <marker id="arrW" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
      <marker id="arrB" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fd4ff"/></marker>
    </defs>
    <g id="sA"></g>
    <g id="sB"></g>
  </svg>
  <canvas id="gl" style="position:absolute;left:0;top:0;width:1280px;height:720px;opacity:0"></canvas>
  <svg id="ov" class="l" width="1280" height="720" viewBox="0 0 1280 720"><g id="oA"></g><g id="oB"></g></svg>
  <svg id="fg" class="l" width="1280" height="720" viewBox="0 0 1280 720">
    <rect width="1280" height="720" fill="url(#vig)"/>
    <rect width="1280" height="720" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
    <rect id="fade" width="1280" height="720" fill="#000" opacity="0"/>
  </svg>
  <div id="ui"></div>
  <div id="board"><div class="h">المغادرون ✈</div></div>
  <div id="title">ماذا لو بقيت <span>الثلوج</span> تتساقط<br>على الأرض كلّها لمدّة سنة؟</div>
  <div id="cap"><div class="line"></div></div>
</div>
<script type="module">import { init } from './gl3d_snow.js'; window.gl3dReady = init(document.getElementById('gl')).then(g => { window.GL = g; return true; });</script>
<script>
const TM = window.TIMING, TOTAL = window.TOTAL;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); };
const R = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647);
const L = i => TM[i];
const W = (i, j) => TM[i].words[j];
const WS = (i, j) => TM[i].words[Math.min(j, TM[i].words.length - 1)][1];
const S0 = i => TM[i].start;
const pmod = (a, m) => ((a % m) + m) % m;

// ---------- captions: chunks of up to 8 words, split at punctuation ----------
const KEY = new Set(['العالمَ', 'أبيض.', 'سنة؟', 'لسنةٍ', 'أسبوع،', 'شهر،', 'الطعام.', 'تسعينَ', 'أكثر…', 'أكثر.', 'البحارِ', 'مئةٍ', 'وعشرينَ', 'متراً.', 'ستّةِ', 'أشهر،', 'جليدٍ', 'سنة،',
  'جليديٌّ', 'سبعمئةِ', 'مليونِ', 'كرةً', 'البراكين.', 'البراكينُ', 'لا.', 'بخارِ', 'الماء.', 'قلَّ', 'تسعةٍ', 'عشرةِ', 'طوابق.', 'لو…؟', 'Lab»…', 'الكبرى', 'الاستوائية', 'الكهرباء', 'المطاراتُ', 'الحبوبِ']);
const CH = [];
TM.forEach((l, i) => { let cur = [];
  l.words.forEach((w, j) => { cur.push(w); const p = /[،.…:؟]$/.test(w[0]); if ((p && cur.length >= 3) || cur.length >= 8 || j === l.words.length - 1) { CH.push({ i, w: cur }); cur = []; } }); });
function renderCap(t) {
  const el = $('cap'), line = el.querySelector('.line');
  let k = -1; CH.forEach((c, j) => { if (t >= c.w[0][1] - .12) k = j; });
  const titleOn = t > S0(3) - .3 && t < S0(4) - .2;
  if (k < 0 || titleOn) { el.style.opacity = 0; return; }
  const c = CH[k], nx = CH[k + 1], endT = c.w[c.w.length - 1][2];
  const inK = ease(ramp(t, c.w[0][1] - .12, c.w[0][1] + .15));
  const outK = nx ? 1 - ease(ramp(t, Math.min(nx.w[0][1] - .12, endT + 1.2), Math.min(nx.w[0][1], endT + 1.5))) : 1 - ramp(t, TOTAL - .6, TOTAL - .1);
  el.style.opacity = inK * outK;
  line.innerHTML = c.w.map(([w, s]) => { const q = ramp(t, s - .06, s + .12), key = KEY.has(w);
    return `<span style="color:${key ? mix('#8a8780', '#f4c76b', q) : mix('#8a8780', '#ffffff', q)}">${w}</span>`; }).join(' ');
}

// ---------- shared drawing ----------
const STARS = (() => { const r = R(17); return Array.from({ length: 220 }, () => [r() * 1280, r() * 720, r() * 1.4 + .3, r() * 6]); })();
const stars = (a, t) => STARS.map(s => `<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="#fff" opacity="${a * (.45 + .45 * Math.sin(t * 1.4 + s[3]))}"/>`).join('');
function space(t, id = 'spg', top = '#060918', bot = '#0b1030') {
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs>` +
    `<rect width="1280" height="720" fill="url(#${id})"/>` + stars(1, t) + `<circle cx="1050" cy="160" r="380" fill="#3b4fa8" opacity=".10" filter="url(#soft)"/>`;
}
function sky(id, top, bot, mid) {
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/>${mid ? `<stop offset=".6" stop-color="${mid}"/>` : ''}<stop offset="1" stop-color="${bot}"/></linearGradient></defs><rect width="1280" height="720" fill="url(#${id})"/>`;
}
// three depth layers of soft flakes; near flakes are big and blurred like a real lens
function snowfall(t, n, a, wind = .25, seed = 99) {
  if (a <= 0) return '';
  let far = '', mid = '', near = ''; const r = R(seed);
  for (let i = 0; i < n; i++) {
    const z = r(), x0 = r() * 1400, ph = r() * 780, sz = .8 + z * z * 5.5, sp = 28 + z * 95, sw = r() * 6.28;
    const y = pmod(ph + t * sp, 780) - 30, x = pmod(x0 + t * sp * wind + Math.sin(t * .9 + sw) * (8 + 14 * z), 1400) - 60;
    const c = `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${sz.toFixed(2)}" fill="url(#flk)" opacity="${(a * (.45 + .55 * z)).toFixed(2)}"/>`;
    if (z > .88) near += c; else if (z > .5) mid += c; else far += c;
  }
  return far + mid + `<g filter="url(#blur2)">${near}</g>`;
}
function blizzard(t, n, a, seed = 77) {
  let s = ''; const r = R(seed);
  for (let i = 0; i < n; i++) { const x0 = r() * 1500, y0 = r() * 720, sp = 260 + r() * 260, z = r();
    const x = pmod(x0 - t * sp * 1.3, 1500) - 110, y = pmod(y0 + t * sp * .55, 760) - 20;
    s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + 18 + z * 14).toFixed(1)}" y2="${(y - 8 - z * 6).toFixed(1)}" stroke="#fff" stroke-width="${(1 + z * 2).toFixed(1)}" opacity="${(a * (.25 + z * .5)).toFixed(2)}" stroke-linecap="round"/>`; }
  return s;
}
// rounded snow cap that sits on top of an object, with a soft blue under-shadow
function cap(x, y, w, h, a = 1) {
  if (a <= 0 || w <= 0) return '';
  const hh = h * a;
  return `<path d="M${x - 2},${y + 2} C${x - 4},${y - hh * .9} ${x + w * .18},${y - hh * 1.05} ${x + w * .5},${y - hh} C${x + w * .82},${y - hh * 1.05} ${x + w + 4},${y - hh * .9} ${x + w + 2},${y + 2} ` +
    `Q${x + w * .75},${y + 5} ${x + w * .5},${y + 3} Q${x + w * .25},${y + 6} ${x - 2},${y + 2}Z" fill="url(#snowCap)"/>` +
    `<path d="M${x},${y + 3} Q${x + w * .5},${y + 7} ${x + w},${y + 3}" stroke="#9fb6cf" stroke-width="2" opacity=".45" fill="none"/>`;
}
// ground of snow with gentle drifts, blue shadows and sparkle
function snowGround(y, t, seed = 3, amp = 14, a = 1, tex = true) {
  if (a <= 0) return '';
  const r = R(seed); let d = `M-20,${y}`;
  for (let x = -20; x <= 1300; x += 80) d += ` Q${x + 40},${y - r() * amp} ${x + 80},${y - r() * amp * .5}`;
  d += ` L1300,740 L-20,740Z`;
  let sp = ''; const rs = R(seed + 9);
  for (let i = 0; i < 40; i++) { const sx = rs() * 1280, sy = y + 8 + rs() * (720 - y), k = .5 + .5 * Math.sin(t * 3 + i * 1.7);
    sp += `<circle cx="${sx}" cy="${sy}" r="${.8 + rs() * 1.2}" fill="#fff" opacity="${(k * k * .9).toFixed(2)}"/>`; }
  return `<g opacity="${a}"><path d="${d}" fill="url(#snowG)"/>${tex ? `<path d="${d}" fill="#fff" filter="url(#snowTex)" opacity=".7"/>` : ''}` +
    `<path d="M-20,${y + 30} ${Array.from({ length: 9 }, (_, i) => `Q${i * 160 + 80},${y + 18 + (i % 2) * 22} ${i * 160 + 160},${y + 32}`).join(' ')}" stroke="#a9c0da" stroke-width="10" opacity=".22" fill="none" filter="url(#blur2)"/>${sp}</g>`;
}
function sunDisk(x, y, r, a, haze = 0) {
  if (a <= 0) return '';
  return `<g opacity="${a}"><circle cx="${x}" cy="${y}" r="${r * 4}" fill="url(#sunGlow)"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#sunCore)" opacity="${1 - haze * .6}"/></g>`;
}
function cloudBank(y, t, col, a, seed = 5, scale = 1, speed = 6) {
  let s = ''; const r = R(seed);
  for (let i = 0; i < 16; i++) { const x = pmod(r() * 1600 + t * speed, 1600) - 160, yy = y + r() * 60 * scale, rx = (120 + r() * 160) * scale, ry = (40 + r() * 40) * scale;
    s += `<ellipse cx="${x}" cy="${yy}" rx="${rx}" ry="${ry}" fill="${col}" opacity="${a * (.55 + r() * .4)}"/>`; }
  return `<g filter="url(#haze)">${s}</g>`;
}
function palmSnow(x, y, h, c, k, t, lean = .12) {
  const tx = x + h * lean, ty = y - h;
  let s = `<path d="M${x},${y} Q${x + h * .02},${y - h * .55} ${tx},${ty}" stroke="${c}" stroke-width="${Math.max(5, h * .055)}" fill="none" stroke-linecap="round"/>`;
  for (let i = 0; i < 9; i++) s += `<path d="M${x + (tx - x) * i / 9 - 4},${y - h * i / 9} l8,-3" stroke="#000" stroke-opacity=".25" stroke-width="2"/>`;
  [-165, -138, -112, -84, -58, -32, -10, 14].forEach((a, i) => {
    const ang = (a + Math.sin(t * 1.1 + i) * 1.2 + k * 8) * Math.PI / 180, Ln = h * .45;
    const ex = tx + Math.cos(ang) * Ln, ey = ty + Math.sin(ang) * Ln * .5 + Ln * (.38 + k * .1), cx = tx + Math.cos(ang) * Ln * .5, cy = ty + Math.sin(ang) * Ln * .5 - Ln * .1;
    s += `<path d="M${tx},${ty} Q${cx},${cy} ${ex},${ey}" stroke="${c}" stroke-width="${Math.max(4, h * .04)}" fill="none" stroke-linecap="round"/>`;
    for (let j = 1; j < 7; j++) { const u = j / 7, px = (1 - u) * (1 - u) * tx + 2 * (1 - u) * u * cx + u * u * ex, py = (1 - u) * (1 - u) * ty + 2 * (1 - u) * u * cy + u * u * ey;
      s += `<path d="M${px},${py} l${-6 - 8 * (1 - u)},${14 * (1 - u * .5)} M${px},${py} l${6 + 8 * (1 - u)},${14 * (1 - u * .5)}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`; }
    if (k > 0) s += `<path d="M${tx},${ty - 2} Q${cx},${cy - 3} ${lerp(tx, ex, .85)},${lerp(ty, ey, .85) - 3}" stroke="#f4f9ff" stroke-width="${Math.max(3, h * .03) * k}" fill="none" stroke-linecap="round" opacity="${k}"/>`;
  });
  if (k > 0) s += `<ellipse cx="${tx}" cy="${ty - 3}" rx="${h * .06 * k + 2}" ry="${h * .03 * k + 1}" fill="#fff" opacity="${k}"/>`;
  return s;
}
function car(x, y, w, col, k, t) {
  const h = w * .32;
  return `<ellipse cx="${x + w / 2}" cy="${y + 2}" rx="${w * .55}" ry="6" fill="#000" opacity=".25" filter="url(#blur2)"/>` +
    `<path d="M${x},${y - h * .25} Q${x},${y - h * .62} ${x + w * .08},${y - h * .62} L${x + w * .25},${y - h * .65} L${x + w * .35},${y - h} L${x + w * .72},${y - h} L${x + w * .85},${y - h * .62} L${x + w * .97},${y - h * .55} Q${x + w},${y - h * .5} ${x + w},${y - h * .25} L${x + w},${y - h * .12} L${x},${y - h * .12}Z" fill="${col}"/>` +
    `<path d="M${x + w * .38},${y - h * .92} L${x + w * .52},${y - h * .92} L${x + w * .52},${y - h * .66} L${x + w * .3},${y - h * .66}Z M${x + w * .56},${y - h * .92} L${x + w * .7},${y - h * .92} L${x + w * .8},${y - h * .66} L${x + w * .56},${y - h * .66}Z" fill="#9fb3c6" opacity="${1 - k * .7}"/>` +
    `<path d="M${x},${y - h * .45} L${x + w},${y - h * .45}" stroke="#000" stroke-opacity=".18" stroke-width="2"/>` +
    [.2, .8].map(u => `<circle cx="${x + w * u}" cy="${y - h * .12}" r="${h * .22}" fill="#15171c"/><circle cx="${x + w * u}" cy="${y - h * .12}" r="${h * .1}" fill="#6b717c"/>`).join('') +
    cap(x + w * .3, y - h, w * .45, h * .55, k) + cap(x + 2, y - h * .62, w * .28, h * .3, k) + cap(x + w * .76, y - h * .6, w * .23, h * .28, k) +
    (k > .5 ? `<path d="M${x - 10},${y + 4} Q${x + w * .5},${y - h * .3 * (k - .5) * 2} ${x + w + 10},${y + 4}Z" fill="url(#snowG)"/>` : '');
}
function lampPost(x, y, h, on) {
  return `<circle cx="${x + 18}" cy="${y - h + 8}" r="130" fill="url(#lampG)" opacity="${.55 * on}"/>` +
    `<rect x="${x - 3}" y="${y - h}" width="6" height="${h}" fill="#151a26"/><path d="M${x},${y - h} q0,-10 18,-6" stroke="#151a26" stroke-width="5" fill="none"/>` +
    `<rect x="${x + 10}" y="${y - h + 2}" width="16" height="10" rx="3" fill="${on > .5 ? '#ffe2ad' : '#556'}"/>` + cap(x + 8, y - h + 2, 20, 6, 1);
}

const rot = (a, Ln) => [Math.sin(a) * Ln, Math.cos(a) * Ln];
function limb(x0, y0, a1, a2, L1, L2, w, c) {
  const [dx1, dy1] = rot(a1, L1), x1 = x0 + dx1, y1 = y0 + dy1, [dx2, dy2] = rot(a2, L2), x2 = x1 + dx2, y2 = y1 + dy2;
