<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Naskh+Arabic:wght@500;700&family=Space+Grotesk:wght@500;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #04060f; }
  #stage { position: relative; width: 720px; height: 1280px; overflow: hidden; }
  svg.l { position: absolute; inset: 0; }
  #cap { position: absolute; left: 40px; right: 40px; top: 108px; text-align: center; }
  #cap .line { font-family: 'Noto Naskh Arabic', serif; direction: rtl; font-size: 46px; font-weight: 700; line-height: 1.55; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.7); }
  #cap .line.big { font-size: 58px; }
  .list { position: absolute; top: 420px; right: 14px; width: 150px; height: 280px; border-radius: 20px; background: rgba(8,12,30,.5); border: 1px solid rgba(255,255,255,.14); }
  .list .hd { position: absolute; top: 12px; left: 0; right: 0; text-align: center; font-family: 'Noto Naskh Arabic', serif; font-size: 18px; font-weight: 700; color: rgba(255,255,255,.6); }
  .list .rail, .list .fill { position: absolute; right: 22px; width: 2px; }
  .list .rail { top: 64px; bottom: 40px; background: rgba(255,255,255,.18); }
  .list .fill { top: 64px; background: #f4c76b; }
  .list .it { position: absolute; right: 36px; width: 106px; text-align: right; transform: translateY(-50%); font-family: 'Noto Naskh Arabic', serif; font-size: 20px; font-weight: 700; white-space: nowrap; direction: rtl; }
  .list .dot { position: absolute; right: 17px; width: 12px; height: 12px; border-radius: 50%; transform: translateY(-50%); }
  .chip { position: absolute; padding: 6px 16px 9px; border-radius: 14px; background: rgba(244,199,107,.96); color: #1c140a; white-space: nowrap; opacity: 0;
          font-family: 'Noto Naskh Arabic', serif; font-weight: 700; font-size: 28px; direction: rtl; transform: translate(-50%, -50%); box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .chip.dark { background: rgba(8,12,30,.72); color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .chip.big { font-size: 40px; padding: 8px 24px 12px; }
  .chip.red { background: rgba(214,64,64,.95); color: #fff; }
  #note { position: absolute; left: 0; right: 0; top: 1180px; text-align: center; font-family: 'Noto Naskh Arabic', serif; font-size: 17px; color: rgba(255,255,255,.5); direction: rtl; }
  #cmt { position: absolute; left: 60px; right: 60px; top: 520px; padding: 22px 26px; border-radius: 22px; background: #fff; direction: rtl; opacity: 0;
         font-family: 'Noto Naskh Arabic', serif; box-shadow: 0 14px 50px rgba(0,0,0,.5); }
  #cmt .u { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; color: #555; }
  #cmt .u i { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#5b7bd5,#9a5bd5); display: inline-block; }
  #cmt .q { margin-top: 10px; font-size: 34px; font-weight: 700; color: #111; line-height: 1.5; }
  #cmt .h { margin-top: 8px; font-size: 22px; color: #777; }
</style>
</head>
<body>
<div id="stage">
  <svg id="v" class="l" width="720" height="1280" viewBox="0 0 720 1280">
    <defs>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
      <filter id="haze" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="grain"><feTurbulence id="turb" type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter>
      <radialGradient id="vig" cx=".5" cy=".46" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
      <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/><stop offset=".35" stop-color="#cfd8ff" stop-opacity=".18"/><stop offset="1" stop-color="#9fb0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampG"><stop offset="0" stop-color="#ffd59a" stop-opacity=".9"/><stop offset=".35" stop-color="#ffb35c" stop-opacity=".3"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
      <radialGradient id="lavaG"><stop offset="0" stop-color="#ffd08a" stop-opacity=".95"/><stop offset=".3" stop-color="#ff6a2a" stop-opacity=".5"/><stop offset="1" stop-color="#ff3a1a" stop-opacity="0"/></radialGradient>
      <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a5d86"/><stop offset="1" stop-color="#0b2238"/></linearGradient>
      <marker id="arrY" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f4c76b"/></marker>
      <marker id="arrW" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker>
    </defs>
    <g id="sA"></g>
    <g id="sB"></g>
  </svg>
  <canvas id="glA" style="position:absolute;left:0;top:0;width:720px;height:1280px;opacity:0"></canvas>
  <canvas id="gl" style="position:absolute;left:0;top:0;width:720px;height:1280px;opacity:0"></canvas>
  <svg id="ov" class="l" width="720" height="1280" viewBox="0 0 720 1280"><g id="oA"></g><g id="oB"></g></svg>
  <svg id="fg" class="l" width="720" height="1280" viewBox="0 0 720 1280">
    <rect width="720" height="1280" fill="url(#vig)"/>
    <rect width="720" height="1280" filter="url(#grain)" opacity=".05" style="mix-blend-mode:overlay"/>
    <rect id="flash" width="720" height="1280" fill="#fff6dc" opacity="0"/>
    <rect id="fade" width="720" height="1280" fill="#000" opacity="0"/>
  </svg>
  <div id="ui"></div>
  <div id="note">* الأحجام والمسافات ليست بمقياسها الحقيقي</div>
  <div id="cap"><div class="line"></div></div>
</div>
<script type="module">import { init } from './gl3d_v2.js'; window.gl3dReady = Promise.all([init(document.getElementById('glA')), init(document.getElementById('gl'))]).then(([a, g]) => { window.GLA = a; window.GL = g; return true; });</script>
<script>
const TM = window.TIMING, TOTAL = window.TOTAL;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join(''); };
const R = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647);
const L = i => TM[i], S0 = i => TM[i].start;
const W = (i, j) => TM[i].words[j];
const WS = (i, j) => TM[i].words[Math.min(j, TM[i].words.length - 1)][1];
const pmod = (a, m) => ((a % m) + m) % m;

// ---------- captions (chunked, like Short #1) ----------
const KEY = new Set(['اختفى', 'القمرُ…', 'الليلة؟', 'مظلمةً', 'آلافُ', 'النجومِ', 'الحيوانات.', 'يصطادُ', 'يختبئُ', 'المرجانيةُ', 'بيوضَها', 'البحر.', 'المدِّ', 'والجزر.', 'الثلث.', 'أبطأُ', 'ميلَ', 'الأرض،', 'دوّامةً', 'ملايينِ', 'السنين…', 'الفصول:', 'حارق،', 'جليديٌّ', 'حارسُ', 'الصامت.', 'سؤالَك']);
const CH = [];
TM.forEach((l, i) => { let cur = [];
  l.words.forEach((w, j) => { cur.push(w); const p = /[،.…:؟]$/.test(w[0]); if ((p && cur.length >= 3) || cur.length >= 7 || j === l.words.length - 1) { CH.push({ i, w: cur }); cur = []; } }); });
function renderCap(t) {
  const el = $('cap'), line = el.querySelector('.line');
  let k = -1; CH.forEach((c, j) => { if (t >= c.w[0][1] - .12) k = j; });
  if (k < 0) { el.style.opacity = 0; return; }
  const c = CH[k], nx = CH[k + 1], endT = c.w[c.w.length - 1][2];
  const inK = ease(ramp(t, c.w[0][1] - .12, c.w[0][1] + .15));
  const outK = nx ? 1 - ease(ramp(t, Math.min(nx.w[0][1] - .12, endT + 1.2), Math.min(nx.w[0][1], endT + 1.5))) : 1 - ramp(t, TOTAL - .6, TOTAL - .1);
  el.style.opacity = inK * outK; el.style.transform = `translateY(${(1 - inK) * 12}px)`;
  line.className = 'line' + (c.i === 0 ? ' big' : '');
  line.innerHTML = c.w.map(([w, s]) => { const q = ramp(t, s - .06, s + .12), key = KEY.has(w);
    return `<span style="color:${key ? mix('#77736d', '#f4c76b', q) : mix('#77736d', '#ffffff', q)}">${w}</span>`; }).join(' ');
}

//@@SHARED@@
//@@PERSON@@
//@@LAMP@@

// ---------- scenes ----------
let F = {};
const pt = (cx, cy, r, a) => [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
function milkyWay(t, a) {
  if (a <= 0) return '';
  let s = `<g opacity="${a}" transform="rotate(-28,360,520)"><ellipse cx="360" cy="520" rx="900" ry="120" fill="#7f8fd0" opacity=".22" filter="url(#haze)"/>` +
    `<ellipse cx="380" cy="510" rx="700" ry="60" fill="#c9b6ff" opacity=".22" filter="url(#haze)"/><ellipse cx="300" cy="530" rx="420" ry="34" fill="#ffe8c8" opacity=".2" filter="url(#haze)"/>`;
  const r = R(61); for (let i = 0; i < 700; i++) { const x = -300 + r() * 1320, y = 520 + (r() + r() + r() - 1.5) * 120, rr = r() * 1.3 + .3;
    s += `<circle cx="${x}" cy="${y}" r="${rr}" fill="#fff" opacity="${(.3 + .6 * r()) * (.6 + .4 * Math.sin(t * 2 + i))}"/>`; }
  for (let i = 0; i < 9; i++) { const x = r() * 1000 - 140, y = 520 + (r() - .5) * 60; s += `<ellipse cx="${x}" cy="${y}" rx="${30 + r() * 60}" ry="${6 + r() * 10}" fill="#05060f" opacity=".16" filter="url(#haze)"/>`; }
  return s + `</g>`;
}
// 0: hook: the Moon above a huge Earth horizon, then it dissolves into dust
function sceneHook(t) {
  const vt = W(0, 4)[1] - .1, gone = ramp(t, vt, vt + .5);
  let s = space(t, '#03050f', '#081030');
  const MX = 360, MY = 600;
  // dust burst + shock ring
  if (t > vt) { const p = clamp((t - vt) / 1.6); let d = '';
    const r = R(5); for (let i = 0; i < 140; i++) { const a = r() * 6.28, sp = 60 + r() * 260, rr = 110 * Math.sqrt(r());
      const [x, y] = pt(MX, MY, rr + sp * p, a); d += `<circle cx="${x}" cy="${y}" r="${(1 + r() * 2.6) * (1 - p * .6)}" fill="#e8e4da" opacity="${(1 - p) * .9}"/>`; }
    s += `<circle cx="${MX}" cy="${MY}" r="${110 + p * 420}" fill="none" stroke="#dfe6ff" stroke-width="${6 * (1 - p)}" opacity="${(1 - p) * .7}"/>` + `<g filter="url(#blur2)">${d}</g>`; }
  s += `<circle cx="${MX}" cy="${MY}" r="330" fill="url(#moonGlow)" opacity="${.6 * (1 - gone)}"/>`;
  F.moon = { x: MX, y: MY, r: 110 * (1 - gone * .3), a: 1 - gone, sunI: 1 }; F.light = [-900, 450];
  F.earth = { x: 360, y: 1330, r: 560, a: 1, sunI: 1, lights: .5, rot: 1.0, tilt: .41 };
  F.flash = (1 - ramp(t, vt, vt + .35)) * (t > vt ? .45 : 0);
  F.ov = '';
  return s;
}
// 1: a dark lake under a sky that fills with stars and the Milky Way; someone with a telescope
function telescope(x, y) {
  return `<g transform="translate(${x},${y})"><line x1="0" y1="0" x2="-26" y2="80" stroke="#2a3048" stroke-width="5"/><line x1="0" y1="0" x2="26" y2="80" stroke="#2a3048" stroke-width="5"/><line x1="0" y1="0" x2="0" y2="82" stroke="#2a3048" stroke-width="5"/>` +
    `<g transform="rotate(-38)"><rect x="-12" y="-14" width="110" height="26" rx="6" fill="#3a4466"/><rect x="92" y="-18" width="22" height="34" rx="5" fill="#4a5478"/><rect x="-26" y="-8" width="16" height="14" fill="#2a3048"/></g></g>`;
}
function sceneLake(t) {
  const st = S0(1), k = ease(ramp(t, WS(1, 11) - .3, WS(1, 18) + .5));
  let s = `<defs><linearGradient id="skL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#010208"/><stop offset=".7" stop-color="#0a1030"/><stop offset="1" stop-color="#1a1f44"/></linearGradient></defs><rect width="720" height="1280" fill="url(#skL)"/>`;
  s += stars(.35 + .65 * k, t) + milkyWay(t, .25 + .75 * k) + `<ellipse cx="360" cy="820" rx="600" ry="120" fill="#3a4a8a" opacity=".35" filter="url(#haze)"/>`;
  // mountains + forest silhouettes
  s += `<path d="M-20,800 L90,700 L170,760 L280,640 L380,740 L470,680 L560,760 L650,690 L740,770 L740,860 L-20,860Z" fill="#0b0f22"/>`;
  let pines = ''; const r = R(8); for (let i = 0; i < 34; i++) { const x = i * 22 - 10 + r() * 10, h = 40 + r() * 60; pines += `<path d="M${x},860 l-12,0 l12,-${h} l12,${h}Z" fill="#05070f"/>`; }
  s += pines;
  // lake with star reflections (no moon path any more)
  s += `<rect y="860" width="720" height="420" fill="#04061a"/>`;
  const rr = R(17); for (let i = 0; i < 160; i++) { const x = rr() * 720, y = 870 + rr() * 300, w = 1 + rr() * 6;
    s += `<rect x="${x + Math.sin(t * 2 + i) * 3}" y="${y}" width="${w}" height="1.2" fill="#fff" opacity="${(.15 + .5 * rr()) * (.35 + .65 * k)}"/>`; }
  s += `<path d="M-20,1150 C150,1120 320,1140 420,1130 C560,1115 640,1140 740,1130 L740,1300 L-20,1300Z" fill="#0c1020"/>`;
  // cabin with a warm window
  s += `<g transform="translate(110,1040)"><rect x="0" y="0" width="120" height="80" fill="#0a0c16"/><polygon points="-12,0 60,-50 132,0" fill="#0a0c16"/><rect x="74" y="26" width="28" height="26" fill="#ffcf87" opacity=".85"/>` +
       `<circle cx="88" cy="40" r="60" fill="url(#lampG)" opacity=".5"/></g>`;
  // stargazer with a telescope on the shore
  s += telescope(470, 1050) + person(560, 1135, { s: .75, face: -1, top: '#3a4466', pants: '#1c2134', skin: '#6a4a3a', hair: '#141010', lookUp: .9, t });
  F.ov = '';
  return s;
}
// 2: night forest: an owl that hunts by moonlight, a rabbit that hides from it
function owl(x, y, s, t, look) {
  const hd = Math.sin(t * 1.3) * 10 * look, bl = (pmod(t, 3.2) < .12) ? .15 : 1;
  return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-46,10 C-60,-60 -40,-120 0,-122 C40,-120 60,-60 46,10 C30,40 -30,40 -46,10Z" fill="#5a4630"/>` +
    `<path d="M-46,10 C-60,-60 -48,-90 -36,-100 C-50,-40 -40,10 -20,34 C-34,32 -42,22 -46,10Z" fill="#3e3020"/><path d="M46,10 C60,-60 48,-90 36,-100 C50,-40 40,10 20,34 C34,32 42,22 46,10Z" fill="#3e3020"/>` +
    Array.from({ length: 12 }, (_, i) => `<path d="M${-24 + (i % 4) * 16},${-40 + Math.floor(i / 4) * 18} q6,6 12,0" stroke="#2a2016" stroke-width="2" fill="none"/>`).join('') +
    `<g transform="rotate(${hd},0,-100)"><ellipse cx="0" cy="-108" rx="44" ry="38" fill="#6b5538"/><path d="M-40,-136 l-8,-26 l22,16Z M40,-136 l8,-26 l-22,16Z" fill="#4a3a26"/>` +
    `<ellipse cx="-18" cy="-110" rx="20" ry="19" fill="#c9b48a"/><ellipse cx="18" cy="-110" rx="20" ry="19" fill="#c9b48a"/>` +
    `<ellipse cx="-18" cy="-110" rx="12" ry="${12 * bl}" fill="#ffb21a"/><ellipse cx="18" cy="-110" rx="12" ry="${12 * bl}" fill="#ffb21a"/>` +
    `<circle cx="-18" cy="-110" r="${6 * bl}" fill="#111"/><circle cx="18" cy="-110" r="${6 * bl}" fill="#111"/><circle cx="-15" cy="-113" r="${2 * bl}" fill="#fff"/><circle cx="21" cy="-113" r="${2 * bl}" fill="#fff"/>` +
    `<path d="M-6,-98 L0,-84 L6,-98Z" fill="#3a2a14"/></g>` +
    `<path d="M-16,36 l-6,14 M-8,36 l0,16 M8,36 l0,16 M16,36 l6,14" stroke="#c9a14a" stroke-width="4" stroke-linecap="round"/></g>`;
}
function rabbit(x, y, s, t, hide) {
  const dy = hide * 60, ear = Math.sin(t * 6) * 4 * (1 - hide);
  return `<g transform="translate(${x},${y + dy}) scale(${s})"><ellipse cx="0" cy="-30" rx="44" ry="32" fill="#8a7a6a"/><circle cx="-40" cy="-30" r="10" fill="#e8e2d4"/>` +
    `<ellipse cx="34" cy="-58" rx="22" ry="20" fill="#9a8a78"/><path d="M30,-74 C24,-120 34,-130 40,-${116 - ear} C44,-100 40,-84 38,-74Z M42,-74 C46,-118 58,-124 60,-${110 - ear} C60,-94 52,-82 48,-72Z" fill="#9a8a78"/>` +
    `<circle cx="44" cy="-62" r="3.4" fill="#111"/><circle cx="45" cy="-63" r="1" fill="#fff"/><path d="M54,-54 l6,2" stroke="#3a2a20" stroke-width="2"/></g>`;
}
function sceneForest(t) {
  const st = S0(2), hide = ease(ramp(t, WS(2, 10), WS(2, 10) + .6)), owlOn = ease(ramp(t, WS(2, 5) - .3, WS(2, 5) + .3));
  let s = `<defs><linearGradient id="skF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#02030a"/><stop offset="1" stop-color="#0b1424"/></linearGradient></defs><rect width="720" height="1280" fill="url(#skF)"/>` + stars(.7, t);
  // tree trunks, far and near
  const r = R(4); for (let i = 0; i < 9; i++) { const x = i * 90 + r() * 30 - 20, w = 18 + r() * 20; s += `<rect x="${x}" y="300" width="${w}" height="900" fill="#0a1018" opacity=".8"/>`; }
  s += `<rect x="-40" y="0" width="150" height="1280" fill="#05070c"/><rect x="600" y="0" width="160" height="1280" fill="#05070c"/>`;
  // branch with owl
  s += `<path d="M90,640 C260,620 380,650 520,610" stroke="#0b0d14" stroke-width="26" stroke-linecap="round"/><path d="M400,630 l60,-50" stroke="#0b0d14" stroke-width="10" stroke-linecap="round"/>`;
  s += `<g opacity="${.35 + .65 * owlOn}">${owl(300, 630, 1.2, t, owlOn)}</g>`;
  // owl eye glow
  s += `<circle cx="300" cy="498" r="${70 * owlOn}" fill="#ffb21a" opacity="${.08 * owlOn}" filter="url(#soft)"/>`;
  // ground, grass, burrow, rabbit
  s += `<path d="M-20,1050 C200,1020 420,1040 740,1010 L740,1300 L-20,1300Z" fill="#0a120c"/>` +
       `<ellipse cx="470" cy="1060" rx="60" ry="22" fill="#020302"/>`;
  s += `<g clip-path="url(#grd)">${rabbit(430, 1060, 1.1, t, hide)}</g><defs><clipPath id="grd"><rect x="0" y="0" width="720" height="1062"/></clipPath></defs>`;
  let gr = ''; const rg = R(9); for (let i = 0; i < 90; i++) { const x = rg() * 740 - 10, h = 20 + rg() * 40, sw = Math.sin(t * 1.5 + i) * 4; gr += `<path d="M${x},1080 q${sw},-${h / 2} ${sw * 2 + 4},-${h}" stroke="#16281a" stroke-width="3" fill="none"/>`; }
  s += gr;
  // fireflies
  for (let i = 0; i < 14; i++) { const rf = R(i + 70); const x = 100 + rf() * 520 + Math.sin(t * .7 + i) * 30, y = 760 + rf() * 260 + Math.cos(t * .9 + i) * 20, b = .5 + .5 * Math.sin(t * 3 + i * 2);
    s += `<circle cx="${x}" cy="${y}" r="10" fill="#d8ff7a" opacity="${.12 * b}" filter="url(#blur2)"/><circle cx="${x}" cy="${y}" r="2.4" fill="#eaff9a" opacity="${b}"/>`; }
  F.ov = '';
  return s;
}
// 3: a coral reef at night: moonlight beams trigger the spawn; without the Moon, it stops
function coral(x, y, sc, col, seed, t) {
  const r = R(seed); let s = '';
  const br = (bx, by, a, len, w, d) => { const ex = bx + Math.cos(a) * len, ey = by + Math.sin(a) * len + Math.sin(t * 1.2 + seed + d) * 1.5;
    s += `<path d="M${bx},${by} L${ex},${ey}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
    if (d < 3) { br(ex, ey, a - .4 - r() * .3, len * .72, w * .72, d + 1); br(ex, ey, a + .4 + r() * .3, len * .72, w * .72, d + 1); } };
  br(x, y, -Math.PI / 2, 60 * sc, 12 * sc, 0);
  return s;
}
function sceneReef(t) {
  const st = S0(3), beams = 1 - ease(ramp(t, WS(3, 9), WS(3, 12) + .4)), spawn = ease(ramp(t, WS(3, 7) - .2, WS(3, 7) + .6));

// 5: the slow danger: Earth's tilt, a spinning top, millions of years, flipped seasons

function sceneTilt(t) {

  F.tilt = { x: ex + Math.cos(a0 + tilt / 2) * (arcR + 40), y: ey + Math.sin(a0 + tilt / 2) * (arcR + 40), deg: tiltDeg };
  F.earth = { x: ex, y: ey, r: er, a: 1, sunI: 1, lights: .3, rot: 1.6, tilt: -tilt }; F.light = [-1400, ey - 200]; F.moon = null;

    o += `<g opacity="${coldA}" transform="translate(${(1 - coldA) * 40},0)"><rect x="370" y="820" width="320" height="360" rx="24" fill="#2a4a6e"/>` +

         `<rect x="370" y="1100" width="320" height="80" fill="#e8f2fa"/>` + Array.from({ length: 30 }, (_, i) => { const rr = R(i + 400); return `<circle cx="${380 + rr() * 300}" cy="${830 + pmod(rr() * 340 + t * 60 * (.5 + rr()), 340)}" r="${1.5 + rr() * 2}" fill="#fff" opacity=".9"/>`; }).join('') +

// 6: the guardian: the Moon comes back beside the Earth, tilt steady again
